name: Build release

on:
  push:
    branches: [ "*" ]
    tags:     [ "*" ]
  pull_request:
  workflow_dispatch:
    inputs:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check native SDK Dockerfile
        run: |
          sdk_version=$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["nativeSdk"])')
          sdk_dockerfile="$RUNNER_TEMP/nativesdk-Dockerfile"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/nunchuk-io/nunchuk-android-nativesdk/$sdk_version/Dockerfile" \
            --output "$sdk_dockerfile"
          if ! diff -u --label "nativesdk $sdk_version/Dockerfile" \
            --label "nunchuk-android/reproducible-builds/Dockerfile" \
            "$sdk_dockerfile" reproducible-builds/Dockerfile; then
            echo "::error::The native SDK $sdk_version Dockerfile does not match the app builder. Align the shared Dockerfile and SDK release pins."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push builder image
        id: builder
        working-directory: ${{ github.workspace }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}/nunchuk-android
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f reproducible-builds/Dockerfile \
            -t "$IMAGE" \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache \
            --cache-to   type=registry,ref=ghcr.io/${{ github.repository }}/builder-cache,mode=max \
            --metadata-file "$RUNNER_TEMP/builder-metadata.json" \
            --push .
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/builder-metadata.json")
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Decode and save keystore files
        env:
          KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_JKS_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES_BASE64" ]; then
            printf '%s' "$KEYSTORE_JKS_BASE64" | base64 -d > "$GITHUB_WORKSPACE/nunchuk-keystore.jks"
            printf '%s' "$KEYSTORE_PROPERTIES_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.properties"
          elif [ -n "$KEYSTORE_JKS_BASE64$KEYSTORE_PROPERTIES_BASE64" ]; then
            echo 'Both signing secrets must be set together.' >&2
            exit 1
          fi

      - name: Build app
        working-directory: ${{ github.workspace }}
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/app-src \
            --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined \
            "$BUILDER_IMAGE" bash -euc '
              mkdir /app
              disorderfs --sort-dirents=yes --reverse-dirents=no /app-src/ /app/
              cd /app
              ./gradlew clean :nunchuk-app:bundleProductionRelease
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: nunchuk-app/build/outputs/bundle/productionRelease

      # Publish the signed AAB to Google Play as a PRODUCTION DRAFT (no rollout
      # to users; you press publish in the Play Console). Requires the
      # PLAY_SERVICE_ACCOUNT_JSON secret (a Google Play service-account key with
      # release permission). The step self-skips when the secret is absent, so
      # CI stays green until it's configured.
      - name: Check Play secret present
        id: play_secret
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to Google Play (production, draft)
        if: >-
          steps.play_secret.outputs.present == 'true' &&
          (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.nunchuk.android
          releaseFiles: nunchuk-app/build/outputs/bundle/productionRelease/*.aab
          track: production
          status: draft
          whatsNewDirectory: distribution/whatsnew
